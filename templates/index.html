<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EN-POLE - Actualités F1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>EN-POLE - Actualités F1</h1>
    </header>
    <main>
        <section id="articles">
            {% for article in articles %}
                <article>
                    <h2>{{ article.title }}</h2>
                    <p><em>{{ article.source }} - {{ article.published }}</em></p>
                    <p>{{ article.summary|safe }}</p>
                    <p><a href="{{ article.link }}" target="_blank">Lire la suite</a></p>
                </article>
            {% endfor %}
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
